apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: i27helpdesk-gateway
  namespace: projecthelpdesk-dev
  annotations: 
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec: 
  ingressClassName: nginx 
  tls:
  - hosts:
    - gateway-dev.mystory2u.com
    secretName: i27helpdesk-gateway-tls
  rules:
  - host: gateway-dev.mystory2u.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend: 
          service:
            name: i27-gateway
            port: 
              number: 80


